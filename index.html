<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Room Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(20,20,30,0.85), rgba(0,0,0,0.95));
      z-index: 10; cursor: pointer; transition: opacity 0.3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay .panel {
      max-width: 480px; padding: 32px 40px; text-align: center;
      background: rgba(15,15,20,0.7); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; backdrop-filter: blur(8px);
    }
    #overlay h1 { font-size: 1.6rem; margin-bottom: 16px; font-weight: 600; }
    #overlay p { color: #aaa; line-height: 1.6; margin-bottom: 14px; font-size: 0.95rem; }
    #overlay .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 18px auto; max-width: 280px; text-align: left; font-size: 0.9rem; }
    #overlay .keys b { color: #6ea8fe; font-family: ui-monospace, Menlo, monospace; }
    #overlay .cta { margin-top: 18px; color: #6ea8fe; font-weight: 500; }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 5;
      font-size: 0.75rem; color: rgba(255,255,255,0.5);
      font-family: ui-monospace, Menlo, monospace; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }
    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
      margin: -3px 0 0 -3px; border-radius: 50%;
      background: rgba(255,255,255,0.6); box-shadow: 0 0 4px rgba(0,0,0,0.6);
      z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    #crosshair.active { opacity: 1; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<div id="overlay">
  <div class="panel">
    <h1>3D Room Explorer</h1>
    <p>A small rendered room with physically-based materials, image-based lighting and soft shadows.</p>
    <div class="keys">
      <b>W A S D</b><span>move</span>
      <b>Space</b><span>up</span>
      <b>Shift</b><span>down</span>
      <b>Mouse</b><span>look around</span>
      <b>Esc</b><span>release cursor</span>
    </div>
    <div class="cta">Click anywhere to enter</div>
  </div>
</div>

<div id="crosshair"></div>
<div id="hud"></div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------- Scene & Camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0e);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0, 1.65, 3.2);

// Image-based lighting from a generated room environment.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0xbcd0ff, 0x2a2620, 0.35);
scene.add(hemi);

// Sunlight through the window
const sun = new THREE.DirectionalLight(0xfff4d6, 3.2);
sun.position.set(-6, 7, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 25;
sun.shadow.camera.left = -6;
sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6;
sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4;
scene.add(sun);

// Warm interior point light (lamp)
const lampLight = new THREE.PointLight(0xffb070, 6, 6, 2);
lampLight.position.set(1.6, 1.45, -1.6);
lampLight.castShadow = true;
lampLight.shadow.mapSize.set(1024, 1024);
lampLight.shadow.bias = -0.0005;
scene.add(lampLight);

// ---------- Procedural textures ----------
function makeCanvasTexture(size, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeDataTexture(size, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex; // linear color space (for normal/roughness)
}

// Wood plank (parquet) albedo
const woodAlbedo = makeCanvasTexture(512, (ctx, s) => {
  const plankH = s / 8;
  for (let i = 0; i < 8; i++) {
    const y = i * plankH;
    const base = 95 + Math.random() * 30;
    ctx.fillStyle = `rgb(${base + 25},${base - 5},${base - 35})`;
    ctx.fillRect(0, y, s, plankH);
    // grain
    for (let g = 0; g < 60; g++) {
      const gy = y + Math.random() * plankH;
      ctx.strokeStyle = `rgba(${30 + Math.random()*20},${20 + Math.random()*15},10,${0.15 + Math.random()*0.25})`;
      ctx.lineWidth = 0.5 + Math.random() * 1.2;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.bezierCurveTo(s*0.3, gy + (Math.random()-0.5)*4, s*0.7, gy + (Math.random()-0.5)*4, s, gy);
      ctx.stroke();
    }
    // edge shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, y, s, 1);
    ctx.fillRect(0, y + plankH - 1, s, 1);
  }
}, 4);

const woodRough = makeDataTexture(512, (ctx, s) => {
  ctx.fillStyle = '#aaa'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 4000; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.15})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
}, 4);

// Wall: subtle plaster
const wallAlbedo = makeCanvasTexture(512, (ctx, s) => {
  const grad = ctx.createLinearGradient(0, 0, 0, s);
  grad.addColorStop(0, '#e8e2d6');
  grad.addColorStop(1, '#d8d1c2');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 8000; i++) {
    ctx.fillStyle = `rgba(${100+Math.random()*60},${90+Math.random()*60},${70+Math.random()*60},${Math.random()*0.06})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
}, 2);

// Rug pattern
const rugAlbedo = makeCanvasTexture(512, (ctx, s) => {
  ctx.fillStyle = '#5a2a30'; ctx.fillRect(0, 0, s, s);
  ctx.strokeStyle = '#c79a4a'; ctx.lineWidth = 6;
  ctx.strokeRect(20, 20, s - 40, s - 40);
  ctx.strokeRect(50, 50, s - 100, s - 100);
  ctx.fillStyle = '#3a1a20';
  for (let i = 0; i < 300; i++) {
    ctx.fillRect(Math.random()*s, Math.random()*s, 2, 2);
  }
  // central diamond
  ctx.fillStyle = '#c79a4a';
  ctx.beginPath();
  ctx.moveTo(s/2, s/2 - 80);
  ctx.lineTo(s/2 + 60, s/2);
  ctx.lineTo(s/2, s/2 + 80);
  ctx.lineTo(s/2 - 60, s/2);
  ctx.closePath(); ctx.fill();
}, 1);

// Painting (canvas of an abstract scene)
const paintingTex = makeCanvasTexture(512, (ctx, s) => {
  const sky = ctx.createLinearGradient(0, 0, 0, s * 0.6);
  sky.addColorStop(0, '#f4c98c');
  sky.addColorStop(1, '#e07a5f');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, s, s * 0.6);
  // sun
  ctx.fillStyle = '#ffeec2';
  ctx.beginPath(); ctx.arc(s*0.7, s*0.35, s*0.08, 0, Math.PI*2); ctx.fill();
  // mountains
  ctx.fillStyle = '#3d405b';
  ctx.beginPath();
  ctx.moveTo(0, s*0.6);
  ctx.lineTo(s*0.25, s*0.35);
  ctx.lineTo(s*0.45, s*0.55);
  ctx.lineTo(s*0.65, s*0.3);
  ctx.lineTo(s*0.85, s*0.5);
  ctx.lineTo(s, s*0.4);
  ctx.lineTo(s, s*0.6);
  ctx.closePath(); ctx.fill();
  // ground
  const ground = ctx.createLinearGradient(0, s*0.6, 0, s);
  ground.addColorStop(0, '#81b29a');
  ground.addColorStop(1, '#3d5a40');
  ctx.fillStyle = ground; ctx.fillRect(0, s*0.6, s, s*0.4);
}, 1);

// ---------- Materials ----------
const floorMat = new THREE.MeshStandardMaterial({
  map: woodAlbedo,
  roughnessMap: woodRough,
  roughness: 0.7,
  metalness: 0.05,
});

const wallMat = new THREE.MeshStandardMaterial({
  map: wallAlbedo,
  roughness: 0.95,
  metalness: 0.0,
});

const ceilingMat = new THREE.MeshStandardMaterial({
  color: 0xf2ede2, roughness: 1.0, metalness: 0.0,
});

const trimMat = new THREE.MeshStandardMaterial({
  color: 0xf6f1e6, roughness: 0.6, metalness: 0.05,
});

// ---------- Room geometry ----------
const ROOM = { w: 8, h: 3, d: 6 };
const half = { x: ROOM.w / 2, y: ROOM.h / 2, z: ROOM.d / 2 };

const room = new THREE.Group();
scene.add(room);

// Floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
room.add(floor);

// Ceiling
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), ceilingMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ROOM.h;
ceiling.receiveShadow = true;
room.add(ceiling);

// Walls (single-sided, facing inward)
function wall(w, h, mat) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.receiveShadow = true;
  return m;
}
const back = wall(ROOM.w, ROOM.h, wallMat);
back.position.set(0, ROOM.h / 2, -half.z);
room.add(back);

const front = wall(ROOM.w, ROOM.h, wallMat);
front.position.set(0, ROOM.h / 2, half.z);
front.rotation.y = Math.PI;
room.add(front);

const right = wall(ROOM.d, ROOM.h, wallMat);
right.position.set(half.x, ROOM.h / 2, 0);
right.rotation.y = -Math.PI / 2;
room.add(right);

// Left wall built from segments to leave a window opening
const leftGroup = new THREE.Group();
leftGroup.position.set(-half.x, 0, 0);
leftGroup.rotation.y = Math.PI / 2;
room.add(leftGroup);

const winW = 2.2, winH = 1.4, winSillY = 0.9;
function wallSegment(w, h, x, y) {
  const m = wall(w, h, wallMat);
  m.position.set(x, y + h / 2, 0);
  leftGroup.add(m);
}
// below window
wallSegment(ROOM.d, winSillY, 0, 0);
// above window
wallSegment(ROOM.d, ROOM.h - winSillY - winH, 0, winSillY + winH);
// left of window
const sideW = (ROOM.d - winW) / 2;
wallSegment(sideW, winH, -(winW / 2 + sideW / 2), winSillY);
wallSegment(sideW, winH, (winW / 2 + sideW / 2), winSillY);

// Window glass + frame
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfd4e6, transmission: 0.95, transparent: true,
  roughness: 0.05, metalness: 0, ior: 1.45, thickness: 0.05,
  attenuationColor: 0xddeeff, attenuationDistance: 2,
});
const glass = new THREE.Mesh(new THREE.PlaneGeometry(winW - 0.1, winH - 0.1), glassMat);
glass.position.set(-half.x + 0.001, winSillY + winH / 2, 0);
glass.rotation.y = Math.PI / 2;
room.add(glass);

// Frame (mullions)
const frameMat = new THREE.MeshStandardMaterial({ color: 0xf0ead8, roughness: 0.5, metalness: 0.05 });
function frameBar(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  return m;
}
const fx = -half.x + 0.04;
room.add(frameBar(0.06, winH, 0.12, fx, winSillY + winH / 2, -winW / 2 + 0.04));
room.add(frameBar(0.06, winH, 0.12, fx, winSillY + winH / 2,  winW / 2 - 0.04));
room.add(frameBar(0.06, 0.08, winW, fx, winSillY + 0.04, 0));
room.add(frameBar(0.06, 0.08, winW, fx, winSillY + winH - 0.04, 0));
room.add(frameBar(0.06, winH, 0.05, fx, winSillY + winH / 2, 0));
room.add(frameBar(0.06, 0.05, winW, fx, winSillY + winH / 2, 0));
// sill
const sill = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, winW + 0.3), trimMat);
sill.position.set(-half.x + 0.1, winSillY - 0.04, 0);
sill.castShadow = sill.receiveShadow = true;
room.add(sill);

// Baseboards (skirting)
const baseboardMat = trimMat;
function baseboard(w, x, z, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, 0.03), baseboardMat);
  m.position.set(x, 0.06, z);
  m.rotation.y = ry;
  m.receiveShadow = true;
  room.add(m);
}
baseboard(ROOM.w, 0, -half.z + 0.015, 0);
baseboard(ROOM.w, 0,  half.z - 0.015, 0);
baseboard(ROOM.d,  half.x - 0.015, 0, Math.PI / 2);
baseboard(ROOM.d, -half.x + 0.015, 0, Math.PI / 2);

// ---------- Furniture ----------

// Rug
const rug = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.2), new THREE.MeshStandardMaterial({
  map: rugAlbedo, roughness: 0.9, metalness: 0.0,
}));
rug.rotation.x = -Math.PI / 2;
rug.position.set(0, 0.005, 0);
rug.receiveShadow = true;
room.add(rug);

// --- Wooden table ---
const tableMat = new THREE.MeshStandardMaterial({
  color: 0x6b3a1f, roughness: 0.45, metalness: 0.05,
});
const table = new THREE.Group();
const top = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.9), tableMat);
top.position.y = 0.78;
top.castShadow = top.receiveShadow = true;
table.add(top);
function leg(x, z) {
  const l = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.78, 0.07), tableMat);
  l.position.set(x, 0.39, z);
  l.castShadow = l.receiveShadow = true;
  table.add(l);
}
leg( 0.74,  0.40);
leg(-0.74,  0.40);
leg( 0.74, -0.40);
leg(-0.74, -0.40);
table.position.set(0.2, 0, -0.2);
room.add(table);

// Vase on table (procedural)
const vaseMat = new THREE.MeshPhysicalMaterial({
  color: 0x2a4d6b, roughness: 0.15, metalness: 0.0,
  clearcoat: 0.9, clearcoatRoughness: 0.05,
});
const vasePoints = [];
for (let i = 0; i <= 12; i++) {
  const t = i / 12;
  const r = 0.08 + 0.07 * Math.sin(t * Math.PI) + 0.02 * Math.sin(t * Math.PI * 4);
  vasePoints.push(new THREE.Vector2(r, t * 0.32));
}
const vase = new THREE.Mesh(new THREE.LatheGeometry(vasePoints, 32), vaseMat);
vase.position.set(0.5, 0.81, -0.2);
vase.castShadow = vase.receiveShadow = true;
room.add(vase);

// Book on table
const bookMat = new THREE.MeshStandardMaterial({ color: 0x8a2c2c, roughness: 0.6, metalness: 0.05 });
const book = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.04, 0.22), bookMat);
book.position.set(-0.1, 0.83, 0.0);
book.rotation.y = 0.3;
book.castShadow = book.receiveShadow = true;
room.add(book);

// --- Chair ---
const chairMat = new THREE.MeshStandardMaterial({ color: 0x3a2515, roughness: 0.55, metalness: 0.05 });
const chair = new THREE.Group();
const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), chairMat);
seat.position.y = 0.45;
chair.add(seat);
const backRest = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.05), chairMat);
backRest.position.set(0, 0.75, -0.225);
chair.add(backRest);
function chairLeg(x, z) {
  const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.45, 0.05), chairMat);
  l.position.set(x, 0.225, z);
  chair.add(l);
}
chairLeg( 0.22,  0.22);
chairLeg(-0.22,  0.22);
chairLeg( 0.22, -0.22);
chairLeg(-0.22, -0.22);
chair.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }});
chair.position.set(0.2, 0, 0.7);
chair.rotation.y = Math.PI;
room.add(chair);

// --- Lamp ---
const lamp = new THREE.Group();
const lampBase = new THREE.Mesh(
  new THREE.CylinderGeometry(0.14, 0.16, 0.04, 32),
  new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.6 })
);
lampBase.position.y = 0.02;
lamp.add(lampBase);
const lampPost = new THREE.Mesh(
  new THREE.CylinderGeometry(0.018, 0.018, 1.2, 16),
  new THREE.MeshStandardMaterial({ color: 0x222, roughness: 0.3, metalness: 0.85 })
);
lampPost.position.y = 0.62;
lamp.add(lampPost);
const shade = new THREE.Mesh(
  new THREE.CylinderGeometry(0.16, 0.22, 0.28, 32, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xf5e1b8, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide, emissive: 0xffb070, emissiveIntensity: 0.25 })
);
shade.position.y = 1.36;
lamp.add(shade);
const bulb = new THREE.Mesh(
  new THREE.SphereGeometry(0.05, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xfff0c0, emissive: 0xffd690, emissiveIntensity: 4, roughness: 0.3 })
);
bulb.position.y = 1.34;
lamp.add(bulb);
lamp.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }});
lamp.position.set(half.x - 0.6, 0, -half.z + 0.6);
room.add(lamp);
lampLight.position.copy(lamp.position).add(new THREE.Vector3(0, 1.36, 0));

// --- Bookshelf ---
const shelfMat = new THREE.MeshStandardMaterial({ color: 0x4a2e1a, roughness: 0.6, metalness: 0.05 });
const shelf = new THREE.Group();
const shelfW = 1.2, shelfH = 1.8, shelfD = 0.32;
const shellSides = [
  [shelfW, 0.04, shelfD,  0,  0.02, 0],
  [shelfW, 0.04, shelfD,  0,  shelfH, 0],
  [0.04, shelfH, shelfD,  -shelfW/2 + 0.02, shelfH/2, 0],
  [0.04, shelfH, shelfD,   shelfW/2 - 0.02, shelfH/2, 0],
  [shelfW - 0.04, 0.03, shelfD - 0.02, 0, shelfH * 0.33, 0],
  [shelfW - 0.04, 0.03, shelfD - 0.02, 0, shelfH * 0.66, 0],
  [shelfW - 0.04, 0.02, shelfD - 0.02, 0, shelfH - 0.02, -shelfD/2 + 0.01],
];
for (const [w,h,d,x,y,z] of shellSides) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), shelfMat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  shelf.add(m);
}
// books on shelves
const bookColors = [0x5b3a29, 0x2e4a3a, 0x6e2a2a, 0x2a3a5e, 0x8a6f2a, 0x3d2e4a, 0x4d1a1a, 0x2f5959];
for (let row = 0; row < 3; row++) {
  let x = -shelfW/2 + 0.06;
  const y = 0.04 + row * shelfH * 0.33 + 0.18;
  while (x < shelfW/2 - 0.08) {
    const bw = 0.04 + Math.random() * 0.05;
    const bh = 0.22 + Math.random() * 0.1;
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.18),
      new THREE.MeshStandardMaterial({ color: bookColors[Math.floor(Math.random() * bookColors.length)], roughness: 0.7 }));
    m.position.set(x + bw/2, y - bh/2 + 0.16, 0);
    m.castShadow = m.receiveShadow = true;
    shelf.add(m);
    x += bw + 0.005;
  }
}
shelf.position.set(-half.x + shelfD/2 + 0.05, 0, half.z - shelfW/2 - 0.4);
shelf.rotation.y = Math.PI / 2;
room.add(shelf);

// --- Painting on wall ---
const painting = new THREE.Group();
const canvasMat = new THREE.MeshStandardMaterial({ map: paintingTex, roughness: 0.85 });
const canvasMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.9), canvasMat);
painting.add(canvasMesh);
const frame = new THREE.Mesh(new THREE.BoxGeometry(1.32, 1.02, 0.04),
  new THREE.MeshStandardMaterial({ color: 0x2a1a0e, roughness: 0.5, metalness: 0.1 }));
frame.position.z = -0.022;
painting.add(frame);
painting.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }});
painting.position.set(0, 1.8, -half.z + 0.03);
room.add(painting);

// --- Sofa ---
const sofaMat = new THREE.MeshStandardMaterial({ color: 0x4a5a6e, roughness: 0.85, metalness: 0.0 });
const sofa = new THREE.Group();
const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.85), sofaMat);
sofaBase.position.y = 0.2;
sofa.add(sofaBase);
const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 0.2), sofaMat);
sofaBack.position.set(0, 0.7, -0.32);
sofa.add(sofaBack);
const sofaArmL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.55, 0.85), sofaMat);
sofaArmL.position.set(-1.0, 0.55, 0);
sofa.add(sofaArmL);
const sofaArmR = sofaArmL.clone(); sofaArmR.position.x = 1.0;
sofa.add(sofaArmR);
// cushions
for (let i = 0; i < 3; i++) {
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.12, 0.7), new THREE.MeshStandardMaterial({ color: 0x5a6b80, roughness: 0.9 }));
  c.position.set(-0.7 + i * 0.7, 0.46, 0.04);
  sofa.add(c);
}
sofa.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }});
sofa.position.set(0, 0, half.z - 0.55);
sofa.rotation.y = Math.PI;
room.add(sofa);

// ---------- Controls ----------
const controls = new PointerLockControls(camera, renderer.domElement);
const overlay = document.getElementById('overlay');
const crosshair = document.getElementById('crosshair');

overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => { overlay.classList.add('hidden'); crosshair.classList.add('active'); });
controls.addEventListener('unlock', () => { overlay.classList.remove('hidden'); crosshair.classList.remove('active'); });

const keys = { w:false, a:false, s:false, d:false, up:false, down:false };
const keyMap = {
  KeyW: 'w', ArrowUp: 'w',
  KeyS: 's', ArrowDown: 's',
  KeyA: 'a', ArrowLeft: 'a',
  KeyD: 'd', ArrowRight: 'd',
  Space: 'up',
  ShiftLeft: 'down', ShiftRight: 'down',
};
window.addEventListener('keydown', (e) => {
  const k = keyMap[e.code];
  if (k) { keys[k] = true; if (e.code === 'Space') e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  const k = keyMap[e.code]; if (k) keys[k] = false;
});

// Camera bounds (small padding so we don't poke through walls)
const PAD = 0.25;
const bounds = {
  minX: -half.x + PAD, maxX: half.x - PAD,
  minY: 0.4, maxY: ROOM.h - 0.2,
  minZ: -half.z + PAD, maxZ: half.z - PAD,
};

const moveSpeed = 2.6;
const tmpForward = new THREE.Vector3();
const tmpRight = new THREE.Vector3();
const worldUp = new THREE.Vector3(0, 1, 0);

const clock = new THREE.Clock();
const hud = document.getElementById('hud');
let frameCount = 0, fpsTime = 0, fps = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  frameCount++; fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(frameCount / fpsTime); frameCount = 0; fpsTime = 0; }

  if (controls.isLocked) {
    camera.getWorldDirection(tmpForward);
    tmpRight.crossVectors(tmpForward, worldUp).normalize();
    const speed = moveSpeed * dt;
    if (keys.w) camera.position.addScaledVector(tmpForward,  speed);
    if (keys.s) camera.position.addScaledVector(tmpForward, -speed);
    if (keys.d) camera.position.addScaledVector(tmpRight,    speed);
    if (keys.a) camera.position.addScaledVector(tmpRight,   -speed);
    if (keys.up)   camera.position.y += speed;
    if (keys.down) camera.position.y -= speed;

    camera.position.x = Math.min(bounds.maxX, Math.max(bounds.minX, camera.position.x));
    camera.position.y = Math.min(bounds.maxY, Math.max(bounds.minY, camera.position.y));
    camera.position.z = Math.min(bounds.maxZ, Math.max(bounds.minZ, camera.position.z));
  }

  hud.textContent = `${fps} fps`;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
